server:
  # 8081, because the agent owns 8080. Two processes is the point of the exercise.
  port: 8081

spring:
  application:
    name: mcp-calendar-server

  ai:
    mcp:
      server:
        # Reported to the client during the MCP handshake and shown on the agent's page, so the
        # panel can say WHICH server answered rather than just that something did.
        name: crispyland-calendar
        version: 2.0.0

        # SSE rather than STREAMABLE or STATELESS. It is the transport the client is configured
        # for, and the pair has to agree: a STREAMABLE server exposes no /sse endpoint, so the
        # client's connection attempt fails at the transport before any MCP message is sent.
        protocol: SSE

        # Blocking server to match the blocking client. A calendar lookup is one short HTTPS
        # round trip, nowhere near worth a reactive stack, and a sync server keeps the tool
        # readable.
        type: SYNC

# One Google account, one consent, two read-only APIs — so these settings sit under `google`
# rather than under either service that uses them.
google:
  # Both default to the repository root, one level above this server — where Google Cloud
  # Console's download lands and where .gitignore already covers them. They are relative, so
  # they only resolve as intended when the process starts in mcp-server/. The startup error
  # prints the absolute path it actually looked at, because that is the only useful thing to
  # say when a relative path misses. Set an absolute path here if your IDE runs elsewhere.
  credentials-file: ../credentials.json

  # Deleting this directory is how you force a fresh consent. The cached credential records the
  # tokens but NOT the scopes they were granted for, so widening the scope list in GoogleAuth
  # without clearing this leaves the old, narrower token in place and the new API fails with
  # 403 ACCESS_TOKEN_SCOPE_INSUFFICIENT at call time rather than at startup.
  token-directory: ../.google-tokens

  # -1 asks for any free loopback port for the consent redirect. A desktop OAuth client is
  # allowed to redirect to any localhost port, so pinning one only risks a collision.
  receiver-port: -1

  # Which zone decides where a calendar day starts and ends. Empty = the JVM's, which is right
  # when this runs on the machine whose schedule is being read. Events only — a task's due date
  # has no time of day to place in a zone.
  time-zone: ""

# The scheduled job: what it writes, when it runs, and what it is allowed to spend on prose.
briefing:
  # Relative, like the Google paths above, and for the same reason — correct when the process starts
  # in mcp-server/. Under systemd it MUST be overridden (BRIEFING_FILE) to an absolute path, because
  # a unit does not start in this directory and the job would otherwise write its history somewhere
  # nobody reads it.
  file: data/briefings.json

  # The schedule to start with, used only when the file has no stored choice. `off` means a fresh
  # install collects nothing until someone picks an option — the same direction an unrecognised value
  # falls back to. Options: off, every-minute, every-5-minutes, every-15-minutes, hourly,
  # every-6-hours, daily.
  schedule: "off"

  # When the `daily` option fires, in google.time-zone. A briefing is read at the start of a day, so
  # the default is early rather than convenient for testing.
  daily-at: "07:00"

  # How many attempts the log keeps. At every-minute this would otherwise grow by 1440 entries a day
  # for a card that shows a handful.
  keep-runs: 20

  narrator:
    # Never hardcoded, exactly as the agent's agent.api-key. Blank is a supported state: the figures
    # are still collected and stored, and the run is logged as not narrated.
    api-key: ${CEREBRAS_API_KEY:}
    endpoint: https://api.cerebras.ai/v1/chat/completions

    # Small on purpose. Turning seven numbers into one sentence is a mechanical rewrite, not a
    # reasoning task, and this runs unattended — the model that costs the least to be wrong is the
    # right one. Its own setting, so it cannot inherit whatever the chat was switched to.
    model: gpt-oss-20b

    # A sentence or two, and a hard ceiling on what a pathological day can spend. Without a
    # reasoning model consuming the budget on hidden thoughts, the full 300 tokens go to prose.
    max-tokens: 300

    # Cerebras does not support reasoning_effort — omit it.
    reasoning-effort: ""

    # Low: the prose should describe the figures printed directly above it, not embroider them.
    temperature: 0.3

    # The whole call. Short, because the scheduler has one thread and a job waiting on a hung
    # provider is a job that is not collecting.
    timeout: 20s

notes:
  # Where saveToFile writes. Relative default is correct on a laptop; override to an absolute
  # path under systemd via NOTES_DIRECTORY.
  directory: ${NOTES_DIRECTORY:./notes}

  groq:
    # Reuses the same key as the briefing narrator.
    api-key: ${CEREBRAS_API_KEY:}
    endpoint: https://api.cerebras.ai/v1/chat/completions
    model: gpt-oss-20b
    # Higher ceiling than the briefing narrator — notes can be several paragraphs.
    max-tokens: 1000
    temperature: 0.5
    reasoning-effort: ""
    timeout: 30s

telegram:
  # Both are blank by default: the job still runs without them, the notifier becomes a no-op.
  # Set via environment: TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID.
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  chat-id: ${TELEGRAM_CHAT_ID:}

logging:
  level:
    # The handshake and tools/list exchange, so the terminal shows the client arriving.
    io.modelcontextprotocol: INFO
    org.springframework.ai.mcp: INFO

    # The collector says what it stored and why it did or did not narrate. At DEBUG it also reports
    # the runs where nothing had changed, which is how the "no model call when idle" claim is checked.
    com.crispyland.mcpserver.briefing: INFO
